[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delivery-zones"
version = "0.1.0"
description = "Delivery coverage by polygons: point-in-zone lookups, overlapping zones and picking the store that serves an address."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shipmind Labs", email = "hello@shipmindlabs.com" }]
keywords = ["delivery", "geospatial", "polygon", "point-in-polygon", "logistics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/shipmindlabs/delivery-zones"
Source = "https://github.com/shipmindlabs/delivery-zones"
Issues = "https://github.com/shipmindlabs/delivery-zones/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_zones"]

[tool.hatch.build.targets.sdist]
include = ["src/delivery_zones", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
